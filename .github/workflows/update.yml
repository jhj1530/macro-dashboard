name: 매일 거시경제 업데이트

on:
  schedule:
    # 평일 한국시간 07:30 (= UTC 전날 22:30, 일~목)
    - cron: "30 22 * * 0-4"
  workflow_dispatch: # Actions 탭의 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

# 동시에 두 번 돌지 않도록 (앞의 실행이 끝날 때까지 대기)
concurrency:
  group: macro-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 대시보드 만들기
        run: python macro_dashboard.py --no-browser

      - name: data/ 변경분 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data/ 변경 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: site/ 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages로 배포
        id: deployment
        uses: actions/deploy-pages@v5
